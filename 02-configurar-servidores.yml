---
- name: Configurar los servidores Ubuntu
  hosts: servidores
  become: true

  tasks:
    - name: Crear el usuario itla
      user:
        name: itla
        state: present
        create_home: yes

    - name: Crear la carpeta app
      file:
        path: /app
        state: directory
        mode: '0755'

    - name: Crear el archivo hola.txt
      copy:
        content: "Hola Mundo desde Ansible e ITLA"
        dest: /app/hola.txt
        mode: '0644'

    - name: Instalar cowsay y htop
      apt:
        name:
          - cowsay
          - htop
        state: present
        update_cache: yes
